<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olgert & Martina - Il nostro matrimonio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  color: #c9a24d;
  font-family: 'Montserrat', sans-serif;
}

header {
  padding: 80px 20px 40px;
  text-align: center;
}

header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 3.5rem;
  margin: 0;
}

.lang {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 10;
}

.lang button, .music-btn {
  margin-left: 5px;
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #c9a24d;
  color: white;
  font-weight: 500;
}

.music-btn {
  position: fixed;
  top: 20px;
  left: 20px;
}

section { padding: 70px 20px; }

.container { max-width: 1000px; margin: auto; }

.section-title h2 {
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: 2.4rem;
  margin-bottom: 25px;
}

.intro-text {
  text-align: center;
  font-style: italic;
  max-width: 750px;
  margin: 0 auto 30px;
  line-height: 1.6;
}

.gold-line {
  width: 70px;
  height: 2px;
  background: #c9a24d;
  margin: 0 auto 35px;
}

.story img,
.hotel img {
  width: 100%;
  max-width: 420px;
  max-height: 520px;
  object-fit: cover;
  margin: auto;
  display: block;
  border-radius: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.hotels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 40px;
  margin-top: 40px;
}

.card {
  background: #ffffff;
  padding: 35px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0,0,0,0.1);
}

input, select, textarea {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 1rem;
  margin-bottom: 15px;
}

.maps-btn {
  display: inline-block;
  margin-top: 20px;
  padding: 14px 32px;
  border-radius: 50px;
  text-decoration: none;
  font-size: 1.05rem;
  color: white;
  background: #c9a24d;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 50px 20px;
  border-top: 1px solid #eee;
}

@media (max-width: 768px) {
  header h1 { font-size: 2.5rem; }
}
</style>
</head>

<body>

<button class="music-btn" onclick="toggleMusic()">🎵 Musica</button>

<div class="lang">
  <button onclick="setLang('it')">IT</button>
  <button onclick="setLang('sq')">AL</button>
</div>

<audio id="bgMusic" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<header>
  <h1>Olgert & Martina</h1>
</header>

<section>
<div class="container" style="text-align:center; max-width:600px;">
<div class="section-title">
<h2>Conferma presenza</h2>
</div>

<input type="text" id="guestName" placeholder="Nome e Cognome">
<input type="number" id="guestCount" placeholder="Numero persone" min="1">

<select id="menuSelect">
<option value="">Preferenze alimentari</option>
<option value="Nessuna">Nessuna</option>
<option value="Vegetariano">Vegetariano</option>
<option value="Vegano">Vegano</option>
<option value="Allergie / Intolleranze">Allergie / Intolleranze</option>
</select>

<textarea id="menuNote" placeholder="Specifica eventuali allergie..." style="display:none;"></textarea>

<div>
<a class="maps-btn" onclick="sendRSVP()">Invia conferma</a>
</div>

</div>
</section>

<footer>
<p>Con amore, Olgert & Martina</p>
</footer>

<script>
const music = document.getElementById("bgMusic");

function toggleMusic() {
  if (music.paused) {
    music.play();
  } else {
    music.pause();
  }
}

document.getElementById("menuSelect").addEventListener("change", function() {
  document.getElementById("menuNote").style.display =
    this.value === "Allergie / Intolleranze" ? "block" : "none";
});

function sendRSVP() {
  const nome = document.getElementById("guestName").value;
  const persone = document.getElementById("guestCount").value;
  const menu = document.getElementById("menuSelect").value;
  const note = document.getElementById("menuNote").value;

  if (!nome || !persone) {
    alert("Compila nome e numero persone.");
    return;
  }

  let msg = "Ciao Olgert & Martina 💛\n\n";
  msg += "Conferma presenza matrimonio 25 Aprile\n\n";
  msg += "Nome: " + nome + "\n";
  msg += "Numero persone: " + persone + "\n";
  msg += "Menu: " + (menu || "Nessuna preferenza");

  if (menu === "Allergie / Intolleranze" && note) {
    msg += "\nDettagli allergie: " + note;
  }

  const url = "https://wa.me/393297544593?text=" + encodeURIComponent(msg);
  window.open(url, "_blank");
}

function setLang(lang){
  location.reload();
}
</script>

</body>
</html>
